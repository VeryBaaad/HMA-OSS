android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.useAndroidX=true
# io.github.libxposed:api / :service 102.0.0 require minCompileSdk 37, which is newer
# than the latest one AGP knows about.
android.suppressUnsupportedCompileSdk=37
# AGP 9 defaults to the new `android { }` DSL, no opt-out needed: the two rikka plugins
# that required the legacy one are gone. dev.rikka.tools.autoresconfig is replaced by the
# :app:generateLangList task and dev.rikka.tools.materialthemebuilder by the checked in
# app/src/main/res/values/md_theme_builder.xml.
org.gradle.jvmargs=-Xmx2048m "-XX:MaxMetaspaceSize=1024m"
